<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Web Sitesi</title>
    <body>
        <!DOCTYPE html>
     <html lang="en">
     <head>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>Navbar</title>
         <style>
             .navbar {
                 display: flex;
                 justify-content: space-between;
                 align-items: center;
                 background-color: #2d4739;
                 padding: 10px 20px;
             }
     
             .navbar .logo {
                 color: white;
                 font-size: 1.5em;
                 text-decoration: none;
             }
     
             .navbar .buttons {
                 display: flex;
                 gap: 10px;
             }
     
             .navbar .buttons a {
                 text-decoration: none;
                 color: white;
                 background-color: #4d6655;
                 padding: 10px 15px;
                 border-radius: 5px;
                 font-size: 0.9em;
             }
     
             .navbar .buttons a:hover {
                 background-color: #6b8571;
             }
     
             .search-bar {
                 display: flex;
                 align-items: center;
                 gap: 10px;
             }
     
             .search-bar input[type="text"] {
                 padding: 5px;
                 border-radius: 5px;
                 border: 1px solid #ccc;
                 width: 200px;
             }
     
             .search-bar button {
                 padding: 5px 10px;
                 border-radius: 5px;
                 border: none;
                 background-color: #4d6655;
                 color: white;
             }
     
             .search-bar button:hover {
                 background-color: #6b8571;
             }
         </style>
     </head>
     <body>
         <div class="navbar">
             <a href="#" class="logo">Freelancer</a>
             <div class="search-bar">
                 <input type="text" placeholder="Arama yapın...">
                 <button>🔍</button>
             </div>
             <div class="buttons">
                 <a href="/ilan_verme">İşinizi Oluşturun</a>
                 <a href="/register">Kayıt Ol</a>
                 <a href="/login">Giriş Yap</a>
             </div>
         </div>
     </body>
    
    
    
    
    
    
    
    
    
    
    
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5ece4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin: 20px 0;
            color: #2d4739;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px;
        }

        .buttons-container a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 100px;
            background-color: #2d4739;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            font-size: 1.1em;
        }

        .buttons-container a:hover {
            background-color: #4d6655;
        }

        .footer {
            text-align: center;
            background-color: #2d4739;
            color: white;
            padding: 10px 0;
            margin-top: auto;
        }
    </style>
</head>
</html>
