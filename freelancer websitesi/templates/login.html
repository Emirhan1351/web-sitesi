<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e5d6cc;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2d4739;
            padding: 10px 20px;
        }

        .navbar .logo {
            color: white;
            font-size: 1.5em;
            text-decoration: none;
        }

        .navbar .buttons {
            display: flex;
            gap: 10px;
        }

        .navbar .buttons a {
            text-decoration: none;
            color: white;
            background-color: #4d6655;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .navbar .buttons a:hover {
            background-color: #6b8571;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-bar input[type="text"] {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 200px;
        }

        .search-bar button {
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            background-color: #4d6655;
            color: white;
        }

        .search-bar button:hover {
            background-color: #6b8571;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background-color: #2d4739;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            color: #fff;
            width: 300px;
        }

        h1 {
            margin-bottom: 20px;
            color: #000;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #d1d1d1;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-bottom: 2px solid #000;
            background: none;
            outline: none;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1a004f;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="#" class="logo">Freelancer</a>
        <div class="search-bar">
            <input type="text" placeholder="Arama yapın...">
            <button>🔍</button>
        </div>
        <div class="buttons">
            <a href="/ilan_verme">İşinizi Oluşturun</a>
            <a href="/register">Kayıt Ol</a>
            <a href="{{ url_for('home') }}">Giriş Yap</a>
        </div>
    </div>
    <div class="container">
        <div class="form-container">
            <h1>Giriş Yap</h1>
            <form method="POST">
                <label for="username">Kullanıcı Adı</label>
                <input type="text" name="username" id="username" required>
                <label for="password">Şifre</label>
                <input type="password" name="password" id="password" required>
                <button type="submit">Giriş Yap</button>
            </form>
        </div>
    </div>
</body>
</html>
